stages:
  experiment:
    foreach: ${methods}
    do:
      cmd: >-
        uv run python run_experiment.py
        --planning-method ${key}
        --grid-size ${experiment.grid_size}
        --episodes ${experiment.episodes}
        --max-steps ${experiment.max_steps}
        --planning-horizon ${experiment.planning_horizon}
        --inference-iterations ${experiment.inference_iterations}
        --planning-iterations ${item.planning_iterations}
        --seed ${experiment.seed}
        --fov-size ${experiment.fov_size}
        --damping ${experiment.damping}
        --obs-alpha ${experiment.obs_alpha}
        --record "first,last"
        --video-dir data/videos/${key}
        --output data/results/${key}.json
        --receding-horizon
      deps:
        - run_experiment.py
        - agents/
        - inference/
        - environments/
        - utils/
      params:
        - experiment
        - methods.${key}
      outs:
        - data/videos/${key}
      metrics:
        - data/results/${key}.json:
            cache: false

  convergence:
    foreach: ${convergence_matrix}
    do:
      cmd: >-
        uv run python run_convergence.py
        --planning-method ${convergence.method}
        --grid-size ${experiment.grid_size}
        --planning-horizon ${convergence.planning_horizon}
        --planning-iterations ${convergence.planning_iterations}
        --fov-size ${experiment.fov_size}
        --seed ${convergence.seed}
        --damping ${item.damping}
        --obs-alpha ${item.obs_alpha}
        --observe-first
        --plot ${key}
        --output data/convergence/${key}/results.json
      deps:
        - run_convergence.py
        - agents/
        - inference/
        - environments/
        - utils/
      params:
        - experiment.grid_size
        - experiment.fov_size
        - convergence
        - convergence_matrix.${key}
      outs:
        - data/convergence/${key}/convergence.png
        - data/convergence/${key}/convergence.tex
      metrics:
        - data/convergence/${key}/results.json:
            cache: false

  frozen_lake:
    foreach: ${frozen_lake_methods}
    do:
      cmd: >-
        uv run python run_frozen_lake.py
        --planning-method ${key}
        --grid-size ${frozen_lake.grid_size}
        --n-configs ${frozen_lake.n_configs}
        --hole-fraction ${frozen_lake.hole_fraction}
        --min-hamming ${frozen_lake.min_hamming}
        --base-noise ${frozen_lake.base_noise}
        --noise-range ${frozen_lake.noise_range}
        --slip-prob ${frozen_lake.slip_prob}
        --episodes ${frozen_lake.episodes}
        --max-steps ${frozen_lake.max_steps}
        --planning-horizon ${frozen_lake.planning_horizon}
        --planning-iterations ${item.planning_iterations}
        --damping ${item.damping}
        --hole-penalty ${frozen_lake.hole_penalty}
        --goal-temperature ${frozen_lake.goal_temperature}
        --scan-cost ${frozen_lake.scan_cost}
        --seed ${frozen_lake.seed}
        --output data/results/frozen_lake/${key}.json
      deps:
        - run_frozen_lake.py
        - agents/frozen_lake_agent.py
        - environments/frozen_lake.py
        - inference/
      params:
        - frozen_lake
        - frozen_lake_methods.${key}
      metrics:
        - data/results/frozen_lake/${key}.json:
            cache: false

  wumpus_world:
    foreach: ${wumpus_world_methods}
    do:
      cmd: >-
        uv run python run_wumpus_world.py
        --planning-method ${key}
        --grid-size ${wumpus_world.grid_size}
        --n-configs ${wumpus_world.n_configs}
        --n-pits ${wumpus_world.n_pits}
        --obs-noise ${wumpus_world.obs_noise}
        --slip-prob ${wumpus_world.slip_prob}
        --episodes ${wumpus_world.episodes}
        --max-steps ${wumpus_world.max_steps}
        --planning-horizon ${wumpus_world.planning_horizon}
        --planning-iterations ${item.planning_iterations}
        --damping ${wumpus_world.damping}
        --scan-cost ${wumpus_world.scan_cost}
        --seed ${wumpus_world.seed}
        --output data/results/wumpus_world/${key}.json
        --receding-horizon
      deps:
        - run_wumpus_world.py
        - agents/wumpus_agent.py
        - environments/wumpus_world.py
        - inference/
      params:
        - wumpus_world
        - wumpus_world_methods.${key}
      metrics:
        - data/results/wumpus_world/${key}.json:
            cache: false

  deterioration:
    cmd: >-
      uv run python run_deterioration.py
      --grid-size ${experiment.grid_size}
      --fov-size ${experiment.fov_size}
      --damping ${experiment.damping}
      --receding-horizon
      --output-dir data/deterioration
    deps:
      - run_deterioration.py
      - agents/
      - inference/
      - environments/
      - utils/
    params:
      - experiment.grid_size
      - experiment.fov_size
      - experiment.damping
      - deterioration
      - deterioration_methods
    outs:
      - data/deterioration/deterioration.png
      - data/deterioration/deterioration.tex
    metrics:
      - data/deterioration/results.json:
          cache: false
