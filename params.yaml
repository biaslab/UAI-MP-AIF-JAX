frozen_lake:
  grid_size: 4
  n_configs: 15
  hole_fraction: 0.2
  min_hamming: 4
  base_noise: 0.4
  noise_range: 0.1
  slip_prob: 0.1
  episodes: 1000
  max_steps: 15
  planning_horizon: 15
  hole_penalty: 2.0
  goal_temperature: 1.0
  scan_cost: 0.1
  seed: 0

frozen_lake_damping:
  n_iterations: 100
  damping: "0.1 0.25 0.5 0.75 1.0"

frozen_lake_methods:
  loopy-vbp:
    planning_iterations: 30
    damping: 1.0
  loopy:
    planning_iterations: 30
    damping: 1.0
  region-extended:
    planning_iterations: 50
    damping: 0.25
  dyn-channel:
    planning_iterations: 25
    damping: 0.25
  nuijten:
    planning_iterations: 30
    damping: 1.0

wumpus_world:
  grid_size: 5
  n_configs: 25
  n_pits: 4
  obs_noise: 0.1
  pos_noise: 0.4
  slip_prob: 0.01
  episodes: 1000
  max_steps: 10
  planning_horizon: 7
  damping: 0.25
  scan_cost: 0.7
  pit_penalty: 1.0
  wumpus_penalty: 1.0
  goal_temperature: 1.0
  seed: 0

wumpus_world_methods:
  loopy-vbp:
    planning_iterations: 30
  loopy:
    planning_iterations: 30
  region-extended:
    planning_iterations: 50
  dyn-channel:
    planning_iterations: 50
  nuijten:
    planning_iterations: 30

rocksample:
  grid_size: 5
  n_rocks: 2
  half_eff_dist: 2.0
  pos_noise: 0.3
  slip_prob: 0.0
  episodes: 1000
  max_steps: 15
  planning_horizon: 15
  good_reward: 2.0
  bad_penalty: 3.0
  exit_reward: 1.0
  goal_temperature: 0.5
  scan_cost: 0.5
  sample_cost: 1.0
  terminal_goal_only: true
  seed: 0

rocksample_methods:
  loopy-vbp:
    planning_iterations: 30
    damping: 1.0
  loopy:
    planning_iterations: 30
    damping: 1.0
  region-extended:
    planning_iterations: 50
    damping: 0.25
  dyn-channel:
    planning_iterations: 50
    damping: 0.25
  nuijten:
    planning_iterations: 30
    damping: 1.0