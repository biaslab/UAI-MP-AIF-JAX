frozen_lake:
  grid_size: 4
  n_configs: 15
  hole_fraction: 0.2
  min_hamming: 4
  base_noise: 0.4
  noise_range: 0.1
  slip_prob: 0.1
  episodes: 100
  max_steps: 15
  planning_horizon: 15
  hole_penalty: 2.0
  goal_temperature: 1.0
  scan_cost: 0.1
  seed: 0

frozen_lake_methods:
  loopy-vbp:
    planning_iterations: 20
    damping: 1.0
  loopy:
    planning_iterations: 20
    damping: 1.0
  region-extended:
    planning_iterations: 50
    damping: 0.25
  dyn-channel:
    planning_iterations: 25
    damping: 0.25
  nuijten:
    planning_iterations: 30
    damping: 1.0
  reduced-region-extended:
    planning_iterations: 30
    damping: 0.3
  bp:
    planning_iterations: 1
    damping: 1.0

wumpus_world:
